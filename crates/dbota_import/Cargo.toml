[package]
name = "dbota_import"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
description = "The asset importer: the manifest's assets read out of a local Dota 2 install (through heatel) into dbota's asset cache, natively and as a browser module (a Web Worker hands it the files the user picked and gets the converted cache back)."

[dependencies]
image.workspace = true
bota_core = { path = "../../../bota/crates/bota_core" }
bota_proto = { path = "../../../bota/crates/bota_proto" }
crc32fast = { version = "1.5", default-features = false, features = ["std"] }
heatel = { workspace = true, features = ["encode"] }
# A prepared cache's zip: inflated with a limit, and written deflated.
miniz_oxide = { version = "0.9.1", default-features = false, features = ["with-alloc"] }
serde_json.workspace = true
# Font validation uses the text engine's parser before accepting an imported face.
skrifa.workspace = true

[dev-dependencies]
texture2ddecoder = "0.1.2"
bevy_image = { workspace = true, features = ["ktx2", "zstd_rust"] }
ktx2 = "0.5"
png = { version = "0.18", default-features = false }
