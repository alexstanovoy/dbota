[package]
name = "dbota_import"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
description = "The asset importer: the manifest's assets read out of a local Dota 2 install (through heatel) into dbota's asset cache, natively and as a browser module (a Web Worker hands it the files the user picked and gets the converted cache back)."

[package.metadata.cargo-machete]
# Match the native client's feature set and keep Bevy's image decoders available to tests.
ignored = ["bevy", "bevy_image", "digest", "fontique", "futures-util", "rand", "sha2"]

[dependencies]
image.workspace = true
bota_core = { path = "../../../bota/crates/bota_core" }
bota_proto = { path = "../../../bota/crates/bota_proto" }
crc32fast = { version = "1.5", default-features = false, features = ["std"] }
heatel = { workspace = true, features = ["encode"] }
serde_json.workspace = true
# Font validation uses the text engine's parser before accepting an imported face.
skrifa.workspace = true

[dev-dependencies]
texture2ddecoder = "0.1.2"
bevy_image = { workspace = true, features = ["ktx2", "zstd_rust"] }
ktx2 = "0.5"
png = { version = "0.18", default-features = false }

# Standalone tests share the native client's dependency features.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
bevy = { workspace = true, features = ["client", "system_font_discovery"] }
digest.workspace = true
fontique = { workspace = true, features = ["fontconfig-dlopen"] }
futures-util.workspace = true
rand.workspace = true
sha2.workspace = true
