[package]
name = "dbota_import"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
description = "The asset importer: the manifest's assets read out of a local Dota 2 install (through heatel) into dbota's asset cache, natively and as a browser module (a Web Worker hands it the files the user picked and gets the converted cache back)."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
heatel = { path = "../../../heatel", features = ["serde"] }
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["Blob", "File", "FileReaderSync"] }

[features]
# The browser module (`web`, wasm32 only): what web/build.sh builds into import/dbota_import.js.
web = []

[dev-dependencies]
crc32fast = "1.5"
texture2ddecoder = "0.1.2"
bevy_image = { version = "=0.19.1", default-features = false, features = ["ktx2", "zstd_rust"] }
ktx2 = "0.5"
png = { version = "0.18", default-features = false }
