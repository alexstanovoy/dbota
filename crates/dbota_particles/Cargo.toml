[package]
name = "dbota_particles"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[package.metadata.cargo-machete]
# Match the native client's features in standalone particle tests.
ignored = ["fontique", "futures-util", "image", "rand"]

[dependencies]
bevy.workspace = true
bytemuck.workspace = true
heatel.workspace = true
serde_json.workspace = true

# Standalone tests share the native client's dependency features.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
bevy = { workspace = true, features = ["client", "system_font_discovery"] }
fontique = { workspace = true, features = ["fontconfig-dlopen"] }
futures-util.workspace = true
heatel = { workspace = true, features = ["encode"] }
image.workspace = true
rand.workspace = true
