# The test groups of this repository, read by tools/test_groups.py (its header says how they are used).
#
# Every test (unit, integration, doc, and the ignored ones the gate runs itself) is in exactly one group. A group selects
# tests by package, target ("lib", "bin:NAME", "test:NAME") and libtest name filters (substrings, as libtest matches them), or
# holds Python unittest files (`unittest = DIR, modules = [...]`). A file says which groups a change to it runs:
#   - a file a group's `paths` names runs that group; the files of a test (its module, its e2e file, tests/NAME.rs) must be
#     named by its group, or `check` fails;
#   - a `[[route]]` names groups for files several groups read: "*" is every group, "prefix*" every group of that prefix, an
#     empty list none (documents, things only the gate runs);
#   - a file nothing names makes `check` fail, and runs every group until it is named.
# Beyond these, the code routes: a Rust file runs the groups of the test files that import it directly, a script a test file
# names runs that file's group, and the baselines file runs the groups of the tests it names (tools/test_groups.py header).
# Modules many others use (session, manifest, ui, units, map, hud, fog, config, camera, ...) are also routed to every client
# group by hand, since the code depends on them further than one import. The groups are a way to run less while working: the
# gate runs the whole suite.

profile = "test-release"
cargo_flags = ["--quiet"]
baselines = "tools/known_baselines.txt"

# Tests the gate runs through its own steps, with the step.
[[outside]]
path = "web/test/test_cache_index.py"
step = "browser (tools/browser_check.sh builds the page first)"

[[outside]]
path = "web/test/test_voice_worker.py"
step = "browser (tools/browser_check.sh builds the page first)"

[[outside]]
path = "tools/test_groups.py"
step = "none: the script, not a test (test_test_groups.py tests it)"

# Files outside the groups' own.
[[route]]
paths = ["Cargo.toml", "Cargo.lock", "build.rs", "assets-manifest/**", "crates/dbota_import/Cargo.toml", "crates/dbota_import/src/**"]
groups = ["*"]

[[route]]
# the client's shared modules and the harness every end-to-end test runs through
paths = [
    "src/main.rs", "src/session.rs", "src/manifest.rs", "src/ui.rs", "src/units.rs", "src/map.rs", "src/hud.rs", "src/fog.rs",
    "src/fog/**", "src/fog.wesl", "src/config.rs", "src/camera.rs", "src/dota_text.rs", "src/input.rs", "src/main_menu/**",
    "src/keys.rs", "src/cachefs.rs", "src/loading.rs", "src/loading/**", "src/pick.rs", "src/settings/**", "src/minimap.rs",
    "src/daylight.rs",
    "src/e2e/mod.rs", "src/e2e/harness.rs", "src/test_support.rs", "tests/common/**", "assets/**",
]
groups = ["client_*"]

[[route]]
# documents, the licence, the fuzz targets and deny.toml (the gate's own steps)
paths = ["**.md", "LICENSE", ".gitignore", "deny.toml", "fuzz/**", "tools/*.sh", "tools/inspect_gltf.py", "tools/subset_fonts.py"]
groups = []

[[group]]
name = "client_guard"
about = "whatever starts, drives or measures the client stays behind the isolation wrappers: the guard reads every source of the repository"
paths = ["tests/client_guard.rs", "tools/client_environment.txt"]
# it scans every tracked Rust, shell, Python and JavaScript file, and the list of variables it guards
also_paths = ["**.rs", "**.sh", "**.py", "**.js"]
tests = [{ package = "dbota", target = "test:client_guard" }]

[[group]]
name = "import"
about = "the asset importer: its units, the golden comparisons and the cache index (the ignored install tests are the gate's)"
paths = ["crates/dbota_import/src/**", "crates/dbota_import/tests/**"]
tests = [{ package = "dbota_import" }]

[[group]]
name = "web"
about = "the browser build's output (Python unittest)"
paths = ["web/**"]
tests = [{ unittest = "web/test", modules = ["test_build_output", "test_optimize"] }]

[[group]]
name = "tooling"
about = "the test groups' own machinery (Python unittest)"
paths = ["tools/test_groups.py", "tools/test_groups.toml", "tools/known_baselines.txt", "tools/test_test_groups.py", "tools/test/**", "tools/test_runner.py", "tools/test.sh"]
tests = [{ unittest = "tools", modules = ["test_test_groups"] }, { unittest = "tools/test", modules = ["test_runner_test"] }]

