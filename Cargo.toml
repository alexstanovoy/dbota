[workspace]
members = [".", "crates/dbota_import", "crates/dbota_import_web", "crates/dbota_particles"]
# Root builds and checks cover every client crate except the browser-only importer module.
default-members = [".", "crates/dbota_import", "crates/dbota_particles"]

[workspace.dependencies]
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
skrifa = { version = "=0.42.1", default-features = false, features = ["std"] }
bytemuck = { version = "1.24", default-features = false, features = ["derive"] }
heatel = { path = "../heatel", default-features = false, features = ["serde"] }
serde_json = { version = "1", default-features = false, features = ["std"] }
bevy = { version = "=0.20.0", default-features = false }
bevy_image = { version = "=0.20.0", default-features = false }
dbota_particles = { path = "crates/dbota_particles", default-features = false }
dbota_import = { path = "crates/dbota_import", default-features = false }
js-sys = { version = "0.3", default-features = false, features = ["std", "unsafe-eval"] }
wasm-bindgen = { version = "0.2", default-features = false, features = ["std"] }
web-sys = { version = "0.3", default-features = false, features = ["std"] }
fontique = { version = "=0.11.0", default-features = false }


[package]
name = "dbota"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
# Bevy's parts dbota draws and plays with, nothing more: no gamepads, no
# system-info polling, no mesh or sprite picking, no post
# processing besides anti-aliasing, no built-in font.
bevy = { workspace = true, features = [
    # The app, its window and its threads.
    "std",
    "async_executor",
    "multi_threaded",
    "bevy_asset",
    "bevy_log",
    "reflect_auto_register",
    "bevy_winit",
    # Dota's mouse cursors, drawn as the install ships them.
    "custom_cursor",
    # A paste (Ctrl+V) into the menu's fields.
    "system_clipboard",
    "x11",
    "wayland",
    # The 3D scene: glTF models and their clips, the sun, PBR, gizmos.
    "bevy_render",
    "bevy_core_pipeline",
    "bevy_pbr",
    "bevy_light",
    "bevy_gltf",
    "gltf_animation",
    "bevy_animation",
    "bevy_mikktspace",
    "bevy_gizmos",
    "bevy_gizmos_render",
    # FXAA and SMAA (its lookup tables are embedded), on WebGPU and WebGL2 alike.
    "bevy_anti_alias",
    "smaa_luts",
    "png",
    # Tony McMapface tonemapping reads its table from a zstd KTX2 file.
    "tonemapping_luts",
    "ktx2",
    "zstd_rust",
    # The interface, and clicks on it.
    "bevy_ui",
    "bevy_input_focus",
    "bevy_ui_render",
    "bevy_ui_widgets",
    "bevy_text",
    "bevy_picking",
    "ui_picking",
    # Sound: Valve's WAVs and voice lines.
    "bevy_audio",
    "wav",
    "mp3",
] }
bota_client_core = { path = "../bota/crates/bota_client_core", features = ["ui"] }
bota_core = { path = "../bota/crates/bota_core" }
bota_proto = { path = "../bota/crates/bota_proto" }
bota_replay = { path = "../bota/crates/bota_replay" }
# The asset importer: `dbota import` on the desktop, and on every target the asset fingerprint a
# cache must carry (the browser runs the importer as a module of its own, web/import_worker.js).
dbota_import.workspace = true
# The sound device, opened by `audio_output`, and the decoders of the cache's WAV and MP3 files
# (`sound_file`); the version Bevy's audio already builds.
rodio = { version = "=0.22.2", default-features = false, features = ["playback", "hound", "mp3"] }
# A cache WAV file's header, read before rodio is handed the file; the version rodio reads with.
hound = "=3.5.1"
# Fallback fonts for the scripts the interface font lacks (bevy_text's font collection).
fontique = { workspace = true, features = ["std"] }
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", default-features = false, features = ["derive", "std"] }
serde_json.workspace = true
# Content-addressed local metadata; already used by the asset pipeline.
blake3 = { version = "1", default-features = false, features = ["std"] }
# Civil dates for local replay history; desktop timezone lookup and browser-local rendering.
jiff = "0.2"
# The fog's cast is a half-float texel (see `fog.rs`).
half = { version = "2.7.1", default-features = false }
# Decoding the cache's block-compressed textures for a GPU that samples none, and its particle
# effects (heatel's definitions, read back from JSON).
heatel.workspace = true
# Particle simulation and rendering compile independently of the client's game systems.
dbota_particles.workspace = true

# wss:// and the matchmaking menu (radovid and the way into a game it hands out) on the desktop: threads and
# sockets; a browser build has the browser's own WebSocket.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
bota_client_core = { path = "../bota/crates/bota_client_core", features = ["ui", "websocket"] }
# The system's fonts stand behind the shipped ones for scripts they lack; fontconfig is opened at
# run time, so building needs no development package and a machine without it just has no system fonts.
bevy = { workspace = true, features = ["system_font_discovery"] }
fontique = { workspace = true, features = ["fontconfig-dlopen"] }
bota_radovid = { path = "../bota/crates/bota_radovid", features = ["native"] }
# A seat claimed in a direct or local game is claimed with a key of the system's randomness.
getrandom = "0.4"

# A browser build draws through WebGPU or WebGL2, one of the features below.
[target.'cfg(target_arch = "wasm32")'.dependencies]
# The cache fetched next to the page (whole files moved, not copied, into the
# client), and the small files it reads at once (the map's trees and buildings).
base64 = { version = "0.23", default-features = false, features = ["alloc"] }
js-sys.workspace = true
wasm-bindgen.workspace = true
wasm-bindgen-futures = "0.4"
web-sys = { workspace = true, features = ["Document", "Element", "Location", "Response", "Storage", "Window", "XmlHttpRequest"] }
bota_radovid = { path = "../bota/crates/bota_radovid", default-features = false, features = ["web"] }
# The Web Audio output of the sound device (see `audio_output`).
rodio = { version = "=0.22.2", default-features = false, features = ["playback", "hound", "mp3", "wasm-bindgen"] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
# The menu's end-to-end tests run the real matchmaking service in-process; its
# launcher starts the real bota_server.
radovid = { path = "../radovid/crates/radovid" }
tokio = { version = "1", features = ["rt-multi-thread"] }
# The menu's typeface test lays out a word from the font file's own advances (the reader parley
# draws with) to tell the install's face from the shipped one.
skrifa = { version = "=0.42.1", default-features = false, features = ["std"] }

[dev-dependencies]
# Game E2E contracts inspect the particles drawn by the separately compiled renderer.
dbota_particles = { workspace = true, features = ["test-support"] }

[features]
# A browser build embeds DBOTA_WEB_REPLAY and takes DBOTA_WEB_ARGS at build time.
web-replay = []
# The graphics API of a browser build, exactly one of the two (no effect on the desktop). Bevy
# fixes its render paths when it is compiled (storage buffers, compute, limits, shader defs), not
# when it runs, so the page carries a client of each and loads the one the browser can draw with.
webgpu = ["bevy/webgpu"]
webgl2 = ["bevy/webgl2"]

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
# Dependency debuginfo is ~5 GB of target/ for bevy and rarely used; the crate keeps its own.
debug = false

# Opt into app-only incremental rebuilding; plain release keeps Cargo's defaults.
[profile.dev_release]
inherits = "release"

[profile.dev_release.package.dbota]
incremental = true

# `--profile dist` is what
# ships and what the size reports measure: thin link-time optimisation in one codegen unit, symbols
# stripped. 70.6 MiB against release's 160 (93 stripped); a full build takes ~6 min, a rebuild after
# one changed file ~3.6 (fat LTO: 64.5 MiB for ~13 and ~8.6 min; nearly all of it LLVM optimising
# Bevy, wgpu and naga as one module, only 2.3 of 61 MB of code being generics instantiated for
# dbota's own types).
[profile.dist]
inherits = "release"
incremental = false
lto = "thin"
codegen-units = 1
strip = true

# `--profile profiling` keeps the symbols and line tables, for profilers and backtraces.
[profile.profiling]
inherits = "release"
debug = "line-tables-only"

# Browser builds balance transfer size and frame time in one codegen unit.
# At s, a warm build of both clients + importer took 365 s with thin LTO, 856 s with fat.
# web/build.sh can also run Binaryen; compare compressed output (web/README.md).
[profile.web]
inherits = "dist"
opt-level = "s"

# Tests keep overflow checks and debug assertions in this repository's crates. Optimization level
# one and many codegen units keep their rebuilds quick. The product profiles use full optimization.
[profile.test-release]
inherits = "release"
debug-assertions = true
overflow-checks = true
opt-level = 1
codegen-units = 256
incremental = true

[profile.test-release.package."*"]
# Dependencies use the same test optimization settings, without application assertions.
debug-assertions = false
overflow-checks = false
