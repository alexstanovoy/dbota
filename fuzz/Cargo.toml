# Coverage-guided fuzz targets for everything dbota reads from a file it did
# not write: Valve's formats (VPK packages, resources, KV3, NTRO, textures,
# sounds, models, meshes, animations, materials, worlds, entity lumps, the
# tooltip, shop and portrait scripts), the importer that converts them, and the
# asset cache as the client reads it back. A workspace of its own: the
# fuzzer's flags and libFuzzer stay out of the main build. `fuzz.sh` builds
# and runs them on stable Rust.
[package]
name = "dbota_fuzz"
version = "0.0.0"
edition = "2024"
license = "MIT"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
# The versions and decoders the client loads its cache with.
bevy_asset = { version = "=0.19.1", default-features = false }
bevy_image = { version = "=0.19.1", default-features = false, features = ["png", "ktx2", "zstd_rust"] }
crc32fast = "1.5"
dbota_assets = { path = "../crates/dbota_assets" }
# The client's glTF loader validates with it, with these extensions.
gltf = { version = "1.4.0", default-features = false, features = [
    "KHR_lights_punctual",
    "KHR_materials_transmission",
    "KHR_materials_ior",
    "KHR_materials_volume",
    "KHR_materials_unlit",
    "KHR_materials_emissive_strength",
    "KHR_texture_transform",
    "extras",
    "extensions",
    "names",
    "utils",
] }
libfuzzer-sys = "0.4"
rodio = { version = "=0.22.2", default-features = false, features = ["hound", "mp3"] }
serde_json = "1"

[workspace]
members = ["."]

[profile.release]
debug = 1
debug-assertions = true
overflow-checks = true

[[bin]]
name = "vpk"
path = "fuzz_targets/vpk.rs"
test = false
doc = false
bench = false

