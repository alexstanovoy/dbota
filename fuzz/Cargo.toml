# Coverage-guided fuzz targets for what dbota reads or makes besides Valve's formats (heatel
# fuzzes those): the importer that converts an install into the asset cache, its manifest plan
# and stamps, and the asset cache as the client reads it back. A workspace of its own: the
# fuzzer's flags and libFuzzer stay out of the main build. `fuzz.sh` builds and runs them on
# stable Rust.
[package]
name = "dbota_fuzz"
version = "0.0.0"
edition = "2024"
license = "MIT"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
# The versions and decoders the client loads its cache with.
bevy_asset = { version = "=0.19.1", default-features = false }
bevy_image = { version = "=0.19.1", default-features = false, features = ["png", "ktx2", "zstd_rust"] }
dbota_import = { path = "../crates/dbota_import" }
# The importer's install made of the fuzzer's input (`heatel::fuzzing::files`).
heatel = { path = "../../heatel" }
libfuzzer-sys = "0.4"
rodio = { version = "=0.22.2", default-features = false, features = ["hound", "mp3"] }
# The flex rigs the face module reads out of a mesh's extras.
serde_json = "1"

[workspace]
members = ["."]

[profile.release]
debug = 1
debug-assertions = true
overflow-checks = true

[[bin]]
name = "cache_image"
path = "fuzz_targets/cache_image.rs"
test = false
doc = false
bench = false

[[bin]]
name = "cache_sound"
path = "fuzz_targets/cache_sound.rs"
test = false
doc = false
bench = false

[[bin]]
name = "import"
path = "fuzz_targets/import.rs"
test = false
doc = false
bench = false

[[bin]]
name = "plan"
path = "fuzz_targets/plan.rs"
test = false
doc = false
bench = false

[[bin]]
name = "cache_face"
path = "fuzz_targets/cache_face.rs"
test = false
doc = false
bench = false

[[bin]]
name = "cache_text"
path = "fuzz_targets/cache_text.rs"
test = false
doc = false
bench = false
